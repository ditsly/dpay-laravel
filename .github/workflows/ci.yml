# CI for the published package repository (ditsly/dpay-laravel, exported from
# integrations/laravel by integrations/tools/export.mjs). Inside the monorepo the same gates run through `composer check`
# and the Docker matrix script (tools/matrix.sh).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  quality:
    name: validate · audit · pint · larastan (PHP 8.5 / Laravel 13 / Guzzle 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, mbstring, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress -c phpstan.tests.neon

  tests:
    name: testbench (PHP ${{ matrix.php }} × Laravel ${{ matrix.laravel }} × Guzzle ${{ matrix.guzzle }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel 11/12 require Guzzle 7; Laravel 13 allows 7 or 8 and runs both. Laravel 10 does not
        # constrain Guzzle, so Composer admits Guzzle 8 there and one cell proves the package on it;
        # a Laravel 10 app still keeps `guzzlehttp/guzzle: ^7` in its own composer.json (Laravel 10's
        # HTTP client calls RequestException methods Guzzle 8 removed), and the other L10 cells pin 7.
        include:
          - { php: '8.1', laravel: '10', testbench: '^8.22', guzzle: '7', deps: highest }
          - { php: '8.1', laravel: '10', testbench: '^8.22', guzzle: '7', deps: lowest }
          - { php: '8.2', laravel: '10', testbench: '^8.22', guzzle: '7', deps: highest }
          - { php: '8.2', laravel: '10', testbench: '^8.22', guzzle: '8', deps: highest }
          - { php: '8.2', laravel: '11', testbench: '^9.0',  guzzle: '7', deps: highest }
          - { php: '8.3', laravel: '10', testbench: '^8.22', guzzle: '7', deps: highest }
          - { php: '8.3', laravel: '11', testbench: '^9.0',  guzzle: '7', deps: highest }
          - { php: '8.3', laravel: '12', testbench: '^10.0', guzzle: '7', deps: highest }
          - { php: '8.4', laravel: '11', testbench: '^9.0',  guzzle: '7', deps: highest }
          - { php: '8.4', laravel: '12', testbench: '^10.0', guzzle: '7', deps: highest }
          - { php: '8.5', laravel: '12', testbench: '^10.0', guzzle: '7', deps: highest }
          - { php: '8.3', laravel: '13', testbench: '^11.0', guzzle: '8', deps: highest }
          - { php: '8.3', laravel: '13', testbench: '^11.0', guzzle: '7', deps: highest }
          - { php: '8.3', laravel: '13', testbench: '^11.0', guzzle: '7', deps: lowest }
          - { php: '8.4', laravel: '13', testbench: '^11.0', guzzle: '8', deps: highest }
          - { php: '8.5', laravel: '13', testbench: '^11.0', guzzle: '8', deps: highest }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, pdo_sqlite
          coverage: none
      - name: Pin the Testbench and Guzzle majors for this cell
        run: |
          composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.testbench }}"
          composer require --no-update --no-interaction "guzzlehttp/guzzle:${{ matrix.guzzle == '8' && '^8.0' || '^7.5' }}"
      - name: Laravel 10/11 are past security support — the matrix installs them on purpose
        if: matrix.laravel == '10' || matrix.laravel == '11'
        run: composer config --json policy.advisories.ignore '["laravel/framework"]'
      - run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }}
      - run: vendor/bin/phpunit
